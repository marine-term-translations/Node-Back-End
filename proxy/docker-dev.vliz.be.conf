server {
    listen 80;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    server_name emobon-kb.web.vliz.be;

    location / {
        proxy_pass http://node_server_backend:5000;
        proxy_redirect off;
        proxy_set_header host $host;
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-forward-for $proxy_add_x_forwarded_for;
    }

    location /api/github/diff {
        proxy_pass http://node_server_backend:5000;
        proxy_redirect off;
        proxy_set_header host $host;
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-forward-for $proxy_add_x_forwarded_for;
        proxy_cache my_cache;
        proxy_cache_valid 200 12h;
        # Bypass cache if Cache-Control: no-cache header is present
        proxy_cache_bypass $http_cache_control;

        # Refresh cache if Cache-Control: no-cache header is present
        proxy_cache_revalidate on;
    }

    location /api/github/branches {
        proxy_pass http://node_server_backend:5000;
        proxy_redirect off;
        proxy_set_header host $host;
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-forward-for $proxy_add_x_forwarded_for;
        proxy_cache my_cache;
        proxy_cache_valid 200 12h;
        # Bypass cache if Cache-Control: no-cache header is present
        proxy_cache_bypass $http_cache_control;

        # Refresh cache if Cache-Control: no-cache header is present
        proxy_cache_revalidate on;
    }

    location ~ ^/api/github/pr/[^/]+/file/[^/]+/approved$ {
        proxy_pass http://node_server_backend:5000;
        proxy_redirect off;
        proxy_set_header host $host;
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-forward-for $proxy_add_x_forwarded_for;
        proxy_cache my_cache;
        proxy_cache_valid 200 12h;
        proxy_cache_bypass $http_cache_control;
        proxy_cache_revalidate on;
    }

    location /api/github/reviewers {
        proxy_pass http://node_server_backend:5000;
        proxy_redirect off;
        proxy_set_header host $host;
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-forward-for $proxy_add_x_forwarded_for;
        proxy_cache my_cache;
        proxy_cache_valid 200 12h;
        proxy_cache_bypass $http_cache_control;
        proxy_cache_revalidate on;
    }
}
